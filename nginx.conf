server {
    listen 80;
	access_log off;
	error_log /dev/null;
    return 301 https://$host$request_uri; 
}

server {
    listen 443 ssl;
    server_name localhost;

	access_log off;
	error_log /dev/null;
	
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # 1. Frontend (Vite)
    location / {
        proxy_pass http://mario-kart-container:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 2. Backend Socket.io
	location /socket.io/ {
		proxy_pass http://nestjs-backend:3000;
		proxy_http_version 1.1;
		
		# Configurazione specifica per l'upgrade
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

		# Disabilita il buffering per evitare ritardi nei pacchetti del gioco
		proxy_buffering off;

		# Timeout lunghi per evitare disconnessioni durante il gioco
		proxy_read_timeout 86400s;
		proxy_send_timeout 86400s;
	}
}