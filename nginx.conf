server {
    listen 80;
	access_log off;
	error_log /dev/null;
    return 301 https://$host$request_uri; 
}

server {
    listen 443 ssl;
    server_name localhost;

	access_log off;
	error_log /dev/null;
	
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # 1. Frontend (Vite)
    location / {
        proxy_pass http://mario-kart-container:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

	location /api/ {
        # Se hai attivato HTTPS nel backend usa https://, altrimenti http://
        proxy_pass https://nestjs-backend:3000/api/; 
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Fondamentale se usi HTTPS self-signed interno
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
    }

    # 2. Backend Socket.io
	location /socket.io/ {
        # Nota: usiamo HTTPS qui perché il backend è in https
        proxy_pass https://nestjs-backend:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        # IP forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- FIX PER HTTPS INTERNO ---
        # Disabilita la verifica del certificato del backend (necessario per self-signed)
        proxy_ssl_verify off;
        # Passa il nome del server per SNI
        proxy_ssl_server_name on;
        
        # Timeout e Buffering
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}