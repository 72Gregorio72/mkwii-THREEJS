services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8443:443"  # Accesso tramite https://localhost:8443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - kart-game
      - kart-server

  kart-game:
    build: ./mario-kart-react
    container_name: mario-kart-container
    volumes:
      - ./mario-kart-react:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  kart-server:
    build: ./backend
    container_name: nestjs-backend
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./certs:/etc/certs:ro
    environment:
      - NODE_ENV=development
    command: npm run start:dev