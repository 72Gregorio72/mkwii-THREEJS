services:
  kart-game:
    build: ./mario-kart-react
    container_name: mario-kart-container
    ports:
      - "5173:5173"
    volumes:
      - ./mario-kart-react:/app               # Sincronizza il tuo codice
      - /app/node_modules    # IMPORTANTE: Usa i node_modules interni al container
    environment:
      - CHOKIDAR_USEPOLLING=true # Fix per aggiornamento automatico file

  kart-server:
      build: ./backend
      container_name: nestjs-backend
      ports:
        - "3000:3000" # porta default per NestJs
      volumes:
        - ./backend:/app
        - /app/node_modules
      environment:
        - NODE_ENV=development
      command: npm run start:dev